[global]
user_agent=Asterisk PBX

; This defines the secure WebSocket transport for WebRTC clients
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8088
cert_file=/etc/asterisk/keys/asterisk.pem
priv_key_file=/etc/asterisk/keys/asterisk.key
method=tlsv1_2
external_signaling_port=8088

; =================================================================================
; TEMPLATES - This is the standard way to reduce repetition
; =================================================================================

; Template for all WebRTC endpoint settings
[webrtc-template](!)
type=endpoint
context=from-internal
disallow=all
allow=opus,ulaw
transport=transport-wss
media_encryption=dtls
dtls_verify=fingerprint
dtls_cert_file=/etc/asterisk/keys/asterisk.pem
dtls_private_key=/etc/asterisk/keys/asterisk.key
dtls_setup=actpass
ice_support=yes
direct_media=no
force_rport=yes
rtp_symmetric=yes
webrtc=yes
rewrite_contact=yes

; Template for Address of Record (AOR) settings
[aor-template](!)
type=aor
max_contacts=1

; Template for authentication settings
[auth-template](!)
type=auth
auth_type=userpass

; =================================================================================
; ENDPOINTS - Define each user here
; =================================================================================

; --- User 1000 ---
[1000](webrtc-template) ; Inherit all the WebRTC settings
aors=1000               ; Link this endpoint to the AOR section named '1000'
auth=auth1000           ; Link this endpoint to the Auth section named 'auth1000'

[1000](aor-template)    ; This is the AOR section for endpoint 1000

[auth1000](auth-template) ; This is the Auth section for endpoint 1000
username=1000
password=pass1000


; --- User 1001 ---
[1001](webrtc-template) ; Inherit all the WebRTC settings
aors=1001               ; Link to AOR '1001'
auth=auth1001           ; Link to Auth 'auth1001'

[1001](aor-template)    ; The AOR for endpoint 1001

[auth1001](auth-template) ; The Auth for endpoint 1001
username=1001
password=pass1001