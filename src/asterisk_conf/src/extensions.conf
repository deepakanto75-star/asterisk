[general]
static = yes
writeprotect = no
autofallthrough = yes
clearglobalvars = no

[globals]
RECORDING_DIR = /var/spool/asterisk/monitor/  ; <-- GOOD: Absolute path, ends with '/'

[from-internal]
exten => _XXXX,1,NoOp(=== New call to ${EXTEN} from ${CALLERID(num)} ===)
  same => n,Set(CALLFILENAME=${STRFTIME(${EPOCH},%Y%m%d-%H%M%S)}-${CALLERID(num)}-${EXTEN}-${UNIQUEID})
  ; <-- GOOD: CALLFILENAME is well-formatted, uses standard characters.

  ; Start recording the call to the configured recordings directory.
  ; MixMonitor will run in the background ('b') and record both legs into a single file.
  same => n,MixMonitor(${RECORDING_DIR}${CALLFILENAME}.wav,b)

  ; Store numeric caller id only (e.g. 1000 instead of "Name" <1000>)
  same => n,Set(CDR(caller_id)=${CALLERID(num)})
  same => n,Set(CDR(src)=${CALLERID(num)})
  same => n,Set(CDR(clid)=${CALLERID(num)})

  same => n,Set(CDR(recording_path)=${RECORDING_DIR}${CALLFILENAME}.wav)
  same => n,Dial(PJSIP/${EXTEN},20,U(sub-voicemail,${EXTEN},1))
  same => n,Hangup()

; --- CORRECTED 'h' EXTENSION LOGIC ---
; The 'h' extension is implicitly executed when a channel hangs up.
; It is NOT typically called via Gosub(), so it should NOT have a 'Return()'.
exten => h,1,NoOp(Call has ended. CDR record will be written by cdr_adaptive_odbc.)
  ; Any other actions you want to perform on hangup should go here.
  ; For example, triggering an AGI script for post-processing recordings.
  ; e.g., same => n,AGI(my_cleanup_script.agi,${UNIQUEID},${CDR(recording_path)})
  same => n,Set(CDR(clid)=${CALLERID(num)})
  ; No explicit Hangup() or Return() needed here.
; -------------------------------------

; Subroutine to handle Voicemail logic
[sub-voicemail]
exten => s,1,NoOp(Voicemail Subroutine: Dialstatus is ${DIALSTATUS})
  same => n,GotoIf($["${DIALSTATUS}" = "NO ANSWER"]?voicemail)
  same => n,Return() ; This is correct, returns to the Dial() application in from-internal

  same => n(voicemail),Voicemail(${ARG1}@default,u)
  ; --- CORRECTED VOICEMAIL FLOW ---
  ; After voicemail, the channel should typically hang up.
  ; The Dial() application in 'from-internal' will then continue its execution path.
  same => n,Hangup()
; ----------------------------------