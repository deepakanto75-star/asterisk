[my_cdr_handle]
connection=asterisk_db_connection
loguniqueid=yes
table=call_logs
alias start => call_start
alias src => caller_id
alias dst => destination
alias dcontext => dcontext ; <--- Add any other aliases you need, e.g., for dcontext

; Add any custom CDR variables or standard ones that are not automatically mapped
; The order here should match your database table column order IF you are not using specific column mappings
; Asterisk CDR modules are usually smart enough to map by name if the column names match
; However, for custom fields like 'recording_path', it's critical it's in this list.
columns => uniqueid,call_start,caller_id,destination,duration,disposition,recording_path,dialstatus