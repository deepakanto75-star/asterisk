stages:
  - deploy

deploy_job:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh rsync sudo
    - /usr/bin/sudo mkdir -p ~/.ssh
    # - echo "Private Key Detail:- $MNSP_OPERATOR_ZB_DOCKER_PRIVATE_KEY"
    - echo "$MNSP_OPERATOR_ZB_DOCKER_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    # - echo "Host:- $MNSP_OPERATOR_ZB_DOCKER_HOST"
    - if [ -n "$MNSP_OPERATOR_ZB_DOCKER_HOST" ]; then ssh-keyscan -p 121 -H "$MNSP_OPERATOR_ZB_DOCKER_HOST" >> ~/.ssh/known_hosts; else echo "Missing MNSP_OPERATOR_ZB_DOCKER_HOST"; exit 1; fi
    # - cat ~/.ssh/id_ed25519
    # - ls -la
  script:
      # Define reusable target path
      - export TARGET_PATH="${NFS_DIRECTORY}mydocuments/k8s-apps/0006-mnserviceproviders.com/cts/v03/"
      - echo "export :- ${TARGET_PATH}"
      
      # Check remote directory (optional)
      # - ssh -i ~/.ssh/id_ed25519 -p 121 "$MNSP_OPERATOR_ZB_DOCKER_USER@$MNSP_OPERATOR_ZB_DOCKER_HOST" "cd \"$NFS_DIRECTORY\" && ls -la"
      
      # Create directory on remote
      # - ssh -p 121 -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "${MNSP_OPERATOR_ZB_DOCKER_USER}@${MNSP_OPERATOR_ZB_DOCKER_HOST}" "sudo mkdir -p \"$TARGET_PATH\""

     
      # Create directory and fix permissions

      - ssh -p 121 -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "${MNSP_OPERATOR_ZB_DOCKER_USER}@${MNSP_OPERATOR_ZB_DOCKER_HOST}" "sudo mkdir -p \"${TARGET_PATH}\" && sudo chown -R \"${MNSP_OPERATOR_ZB_DOCKER_USER}:${MNSP_OPERATOR_ZB_DOCKER_USER}\" \"${TARGET_PATH}\""


      # Sync files using rsync
      - /usr/bin/sudo /usr/bin/rsync -rvh --delete --exclude='.git' --exclude='.env' -e "ssh -p 121 -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519" ./ "${MNSP_OPERATOR_ZB_DOCKER_USER}@${MNSP_OPERATOR_ZB_DOCKER_HOST}:$TARGET_PATH"





      # Run remote Development script
      - ssh -p 121 -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "${MNSP_OPERATOR_ZB_DOCKER_USER}@${MNSP_OPERATOR_ZB_DOCKER_HOST}" "cd \"$TARGET_PATH\" && sudo bash -x ./01_build_base_img.sh dev" | tee build_output.log
      # - ssh -p 121 -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "${MNSP_OPERATOR_ZB_DOCKER_USER}@${MNSP_OPERATOR_ZB_DOCKER_HOST}" "cd \"$TARGET_PATH\" && sudo bash -x ./02_build_apps.sh dev" | tee build_output.log
      # - ssh -p 121 -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "${MNSP_OPERATOR_ZB_DOCKER_USER}@${MNSP_OPERATOR_ZB_DOCKER_HOST}" "cd \"$TARGET_PATH\" && sudo bash -x ./03_update_config.sh dev" | tee build_output.log
      
      # Decommission old images remote Development script
      # - ssh -p 121 -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "${MNSP_OPERATOR_ZB_DOCKER_USER}@${MNSP_OPERATOR_ZB_DOCKER_HOST}" "cd \"$TARGET_PATH\" && sudo bash -x ./04_decommision.sh dev" | tee build_output.log


      # Run remote uat script
      # - ssh -p 121 -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "${MNSP_OPERATOR_ZB_DOCKER_USER}@${MNSP_OPERATOR_ZB_DOCKER_HOST}" "cd \"$TARGET_PATH\" && sudo bash -x ./build.sh uat" | tee build_output.log
      
      # Run remote production script
      # - ssh -p 121 -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "${MNSP_OPERATOR_ZB_DOCKER_USER}@${MNSP_OPERATOR_ZB_DOCKER_HOST}" "cd \"$TARGET_PATH\" && sudo bash -x ./build.sh prod" | tee build_output.log

  only:
      # - initial_setup